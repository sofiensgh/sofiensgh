<svg width="1000" height="170" viewBox="0 0 1000 170" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      @keyframes flicker {
        0%, 100% { opacity: 1 }
        2%       { opacity: .78 }
        3%       { opacity: 1 }
        5%       { opacity: .55 }
        6%       { opacity: 1 }
        25%      { opacity: .7 }
        26%      { opacity: 1 }
        50%      { opacity: .9 }
        51%      { opacity: 1 }
      }
      @keyframes blink { 0%, 49% { opacity: 1 } 50%, 100% { opacity: 0 } }
      @keyframes underline { from { transform: translateX(-320px) } to { transform: translateX(1320px) } }
      .flicker { animation: flicker 5s linear infinite }
      .cursor  { animation: blink 1s steps(1) infinite }
      .sweep   { animation: underline 5s linear infinite }
    </style>
    <filter id="glow" x="-40%" y="-60%" width="180%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <text x="500" y="86" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-weight="bold" font-size="62" fill="#39ff14" class="flicker" filter="url(#glow)">SOFIEN ESSGHAIER</text>

  <text x="500" y="122" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="19" letter-spacing="7" fill="#9bff77">FULL-STACK DEVELOPER</text>

  <rect x="684" y="110" width="11" height="17" fill="#39ff14" class="cursor"/>

  <g class="sweep">
    <line x1="0" y1="150" x2="90" y2="150" stroke="#39ff14" stroke-width="2"/>
    <line x1="90" y1="150" x2="150" y2="150" stroke="#0f5f1d" stroke-width="2"/>
  </g>
</svg>
