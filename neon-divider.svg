<svg width="900" height="16" viewBox="0 0 900 16" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes sweep { from { transform: translateX(-90px) } to { transform: translateX(990px) } }
      .comet { animation: sweep 5s linear infinite }
    </style>
  </defs>
  <line x1="0" y1="8" x2="900" y2="8" stroke="#14391f" stroke-width="2"/>
  <g class="comet">
    <line x1="-22" y1="8" x2="0" y2="8" stroke="#39ff14" stroke-width="3"/>
    <circle cx="0" cy="8" r="3.5" fill="#39ff14" opacity="0.45"/>
    <circle cx="0" cy="8" r="1.8" fill="#eaffe8"/>
  </g>
</svg>
