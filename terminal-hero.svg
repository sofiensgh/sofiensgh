<svg width="760" height="230" viewBox="0 0 760 230" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      @keyframes blink { 0%, 49% { opacity: 1 } 50%, 100% { opacity: 0 } }
      .cursor { animation: blink 1s steps(1) infinite }
    </style>
    <clipPath id="frame"><rect x="0.5" y="0.5" width="759" height="229" rx="10"/></clipPath>
    <filter id="glow" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0.5" y="0.5" width="759" height="229" rx="10" fill="#04090a" stroke="#1f6b2b" stroke-width="1.5"/>
  <g clip-path="url(#frame)">
    <rect x="0" y="0" width="760" height="27" fill="#0c1412"/>
    <rect x="0" y="26" width="760" height="1" fill="#1f6b2b"/>
  </g>
  <circle cx="17" cy="14" r="5" fill="#ff5f56"/>
  <circle cx="33" cy="14" r="5" fill="#ffbd2e"/>
  <circle cx="49" cy="14" r="5" fill="#27c93f"/>
  <text x="380" y="18" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="11" fill="#6b9a76">sofiensgh@matrix: ~</text>

  <g font-family="'Courier New',Courier,monospace" font-size="15" fill="#39ff14">
    <text x="24" y="58" opacity="0">$ whoami<animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="0.5s" fill="freeze"/></text>
    <text x="24" y="80" opacity="0">sofien  --  full-stack developer<animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="1.2s" fill="freeze"/></text>
    <text x="24" y="102" opacity="0">$ ./boot --mode=attract<animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="1.9s" fill="freeze"/></text>
    <text x="24" y="124" opacity="0">  loading modules ..... OK<animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="2.6s" fill="freeze"/></text>
    <text x="24" y="146" opacity="0">  connecting github .... OK<animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="3.2s" fill="freeze"/></text>
    <text x="24" y="168" opacity="0">$ status<animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="4.0s" fill="freeze"/></text>
    <text x="24" y="190" font-weight="bold" fill="#7bff4d" opacity="0" filter="url(#glow)">OPEN TO OPPORTUNITIES<animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="4.8s" fill="freeze"/></text>
  </g>

  <text x="24" y="212" font-family="'Courier New',Courier,monospace" font-size="15" fill="#39ff14" opacity="0">$<animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="5.5s" fill="freeze"/></text>
  <text class="cursor" x="40" y="212" font-family="'Courier New',Courier,monospace" font-size="15" fill="#39ff14">&#x258A;</text>
</svg>
